<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhoLikedThat - TikTok Analytics</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2.5rem;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            background-color: #fe2c55;
            color: white;
            padding: 0.75rem 1.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #e61e44;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748b;
        }
        .footer a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WhoLikedThat</h1>
        <p>Securely connect your TikTok account to view advanced analytics, interaction insights, and content engagement metrics in real time.</p>
        <a href="#" class="btn">Log in with TikTok</a>
        <div class="footer">
            <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a> | <a href="#">Support</a>
        </div>
    </div>
</body>
</html>
